<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OPIC Gemini Pro — Sửa Lỗi JSON</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --bg: #0d0f14; --surface: #161923; --surface2: #1e2330;
            --border: #2a3040; --accent: #38bdf8; --text: #e8ecf4; --text2: #8a95ad;
            --korean: 'Noto Sans KR', sans-serif; --viet: 'Be Vietnam Pro', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: var(--viet); min-height: 100vh; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: var(--surface); padding: 25px; border-radius: 15px; border: 1px solid var(--border); }
        h2 { margin-bottom: 20px; color: var(--accent); text-align: center; }
        label { display: block; font-size: 12px; margin-bottom: 8px; color: var(--text2); font-weight: bold; }
        input, textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 8px; margin-bottom: 15px; outline: none; font-family: inherit; }
        button { width: 100%; background: var(--accent); color: #000; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:disabled { opacity: 0.5; }
        #result-box { margin-top: 20px; padding: 15px; background: #1e293b; border-radius: 8px; display: none; border-left: 4px solid var(--accent); }
        .error-log { color: #f87171; font-size: 13px; margin-top: 10px; font-family: monospace; }
    </style>
</head>
<body>

<div class="container">
    <h2>🇰🇷 OPIC AI Trainer</h2>
    
    <label>GOOGLE GEMINI API KEY</label>
    <input type="password" id="api-key" placeholder="Dán API Key của bạn vào đây...">

    <label>CÂU HỎI TIẾNG HÀN</label>
    <textarea id="inp-question" rows="2" placeholder="Ví dụ: 자기소개를 해보세요."></textarea>

    <label>CÂU TRẢ LỜI CỦA BẠN</label>
    <textarea id="inp-answer" rows="5" placeholder="Nhập bài nói của bạn..."></textarea>

    <button id="btn-run" onclick="startAnalysis()">PHÂN TÍCH NGAY</button>
    
    <div id="result-box">
        <h4 style="margin-bottom: 10px;">Kết quả phân tích:</h4>
        <div id="output-content"></div>
    </div>
    <div id="error-display" class="error-log"></div>
</div>

<script>
    async function startAnalysis() {
        const key = document.getElementById('api-key').value.trim();
        const ans = document.getElementById('inp-answer').value.trim();
        const que = document.getElementById('inp-question').value.trim();
        const btn = document.getElementById('btn-run');
        const errDisp = document.getElementById('error-display');
        const resBox = document.getElementById('result-box');

        if (!key || !ans) return alert("Vui lòng nhập đầy đủ Key và Câu trả lời!");

        btn.disabled = true;
        btn.innerText = "⏳ Đang kết nối Gemini...";
        errDisp.innerText = "";
        resBox.style.display = "none";

        const prompt = `Phân tích câu trả lời tiếng Hàn: "${ans}" cho câu hỏi "${que}". Trả về JSON: {"feedback": "nhận xét tiếng Việt", "score": 80}`;

        try {
            // Sử dụng endpoint chuẩn và mới nhất của Gemini 1.5 Flash
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: {
                        responseMimeType: "application/json"
                    }
                })
            });

            // KIỂM TRA PHẢN HỒI: Nếu không phải JSON, fetch sẽ ném lỗi ở đây
            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`Google API báo lỗi (${response.status}): ${errorText}`);
            }

            const data = await response.json();
            
            // Bóc tách dữ liệu từ cấu trúc của Gemini
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                const aiText = data.candidates[0].content.parts[0].text;
                const result = JSON.parse(aiText);
                
                resBox.style.display = "block";
                document.getElementById('output-content').innerHTML = `
                    <p><b>Điểm số:</b> ${result.score}/100</p>
                    <p><b>Nhận xét:</b> ${result.feedback}</p>
                `;
            }

        } catch (e) {
            console.error(e);
            errDisp.innerHTML = `<b>Lỗi hệ thống:</b><br>${e.message}<br><br><i>Gợi ý: Hãy kiểm tra lại API Key hoặc đảm bảo bạn đã bật "Gemini API" trong Google Cloud Console.</i>`;
        } finally {
            btn.disabled = false;
            btn.innerText = "PHÂN TÍCH NGAY";
        }
    }
</script>

</body>
</html>
