<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OPIC Pro AI - Fixed</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f1f5f9; }
        body { background: var(--bg); color: var(--text); font-family: 'Be Vietnam Pro', sans-serif; padding: 20px; }
        .app-container { max-width: 600px; margin: 0 auto; background: var(--card); padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1 { color: var(--accent); text-align: center; margin-bottom: 25px; font-size: 24px; }
        label { display: block; font-size: 13px; margin-bottom: 8px; color: var(--accent); font-weight: bold; }
        input, textarea { width: 100%; background: #0f172a; border: 1px solid #334155; color: #fff; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-family: inherit; }
        button { width: 100%; background: var(--accent); color: #0f172a; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; }
        button:disabled { background: #64748b; cursor: not-allowed; }
        #log { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; background: #000; font-family: monospace; font-size: 12px; white-space: pre-wrap; }
        .success { color: #4ade80; border: 1px solid #4ade80; }
        .error { color: #f87171; border: 1px solid #f87171; }
    </style>
</head>
<body>

<div class="app-container">
    <h1>🇰🇷 OPIC AI TRAINER</h1>
    
    <label>GOOGLE API KEY</label>
    <input type="password" id="api-key" placeholder="Dán key bắt đầu bằng AIza...">

    <label>CÂU HỎI (TIẾNG HÀN)</label>
    <input type="text" id="inp-q" placeholder="Ví dụ: 자기소개를 하세요.">

    <label>CÂU TRẢ LỜI CỦA BẠN</label>
    <textarea id="inp-a" rows="5" placeholder="Nhập bài nói của bạn..."></textarea>

    <button id="run-btn" onclick="analyze()">PHÂN TÍCH BÀI NÓI</button>
    
    <div id="log"></div>
</div>

<script>
    async function analyze() {
        const key = document.getElementById('api-key').value.trim();
        const ans = document.getElementById('inp-a').value.trim();
        const que = document.getElementById('inp-q').value.trim();
        const btn = document.getElementById('run-btn');
        const log = document.getElementById('log');

        if (!key || !ans) { alert("Thiếu thông tin!"); return; }

        btn.disabled = true;
        btn.innerText = "⏳ Đang xử lý...";
        log.style.display = "block";
        log.className = "";
        log.innerText = "Đang gửi yêu cầu đến Google...";

        // Prompt ép AI trả về JSON sạch
        const promptText = `Bạn là giám khảo OPIc. Hãy chấm điểm bài nói tiếng Hàn: "${ans}" cho câu hỏi "${que}". 
        Hãy trả về kết quả duy nhất ở định dạng JSON như sau: {"score": 85, "feedback": "nhận xét ngắn gọn bằng tiếng Việt"}`;

        try {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: promptText }] }]
                })
            });

            const data = await response.json();

            // Kiểm tra lỗi từ phía Google
            if (data.error) {
                throw new Error(`Lỗi Google: ${data.error.message}`);
            }

            // Lấy text và làm sạch các ký tự markdown (```json ...)
            let rawAiText = data.candidates[0].content.parts[0].text;
            let cleanJson = rawAiText.replace(/```json|```/g, "").trim();
            
            const result = JSON.parse(cleanJson);
            
            log.className = "success";
            log.innerHTML = `✅ <b>KẾT QUẢ:</b><br><br><b>Điểm:</b> ${result.score}/100<br><b>Nhận xét:</b> ${result.feedback}`;

        } catch (e) {
            log.className = "error";
            log.innerText = "❌ LỖI HỆ THỐNG:\n" + e.message + "\n\nGiải pháp: Kiểm tra lại API Key hoặc dán lại bài nói.";
            console.error(e);
        } finally {
            btn.disabled = false;
            btn.innerText = "PHÂN TÍCH BÀI NÓI";
        }
    }
</script>

</body>
</html>
