<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OPIC 한국어 IM — Luyện thi thông minh</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --bg: #0d0f14; --surface: #161923; --surface2: #1e2330;
            --border: #2a3040; --accent: #4f8ef7; --accent2: #a78bfa;
            --accent3: #34d399; --accent4: #f59e0b; --danger: #f87171;
            --text: #e8ecf4; --text2: #8a95ad; --text3: #4a5568;
            --korean: 'Noto Sans KR', sans-serif; --viet: 'Be Vietnam Pro', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: var(--viet); min-height: 100vh; }
        header {
            background: rgba(13, 15, 20, 0.8); border-bottom: 1px solid var(--border);
            padding: 15px 25px; display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100; backdrop-filter: blur(12px);
        }
        .logo-badge {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 8px; padding: 4px 10px; font-weight: 700; color: #fff;
        }
        nav { display: flex; gap: 5px; }
        .nav-btn {
            background: none; border: none; color: var(--text2); padding: 8px 12px;
            cursor: pointer; border-radius: 6px; font-size: 13px; transition: 0.3s;
        }
        .nav-btn.active { color: var(--accent); background: rgba(79,142,247,0.1); }
        main { max-width: 800px; margin: 0 auto; padding: 30px 20px; }
        .section { display: none; }
        .section.visible { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .input-card { background: var(--surface); border: 1px solid var(--border); padding: 20px; border-radius: 12px; margin-bottom: 15px; }
        .input-textarea {
            width: 100%; background: var(--surface2); border: 1px solid var(--border);
            color: #fff; padding: 12px; border-radius: 8px; font-family: var(--korean); margin-top: 10px;
        }
        .btn-primary {
            background: var(--accent); color: white; border: none; padding: 12px 24px;
            border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; transition: 0.3s;
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .loading-bar { height: 4px; background: var(--surface2); border-radius: 2px; margin: 15px 0; overflow: hidden; display: none; }
        .loading-bar.show { display: block; }
        .loading-fill { height: 100%; background: var(--accent); width: 40%; animation: loading 1.5s infinite; }
        @keyframes loading { from { margin-left: -40%; } to { margin-left: 100%; } }

        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .flash-card { background: var(--surface); border: 1px solid var(--border); padding: 20px; border-radius: 12px; text-align: center; position: relative; }
        .grammar-block { background: var(--surface); border-left: 4px solid var(--accent); padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-right: 5px; background: var(--surface2); color: var(--accent2); }
        
        .test-box { background: var(--surface); border: 1px solid var(--border); padding: 30px; border-radius: 16px; text-align: center; }
        .record-btn {
            width: 60px; height: 60px; border-radius: 50%; border: none; background: var(--danger);
            color: white; font-size: 24px; cursor: pointer; transition: 0.3s;
        }
        .record-btn.recording { animation: pulse 1s infinite; background: #ff0000; }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(248,113,113,0.7); } 70% { transform: scale(1.1); box-shadow: 0 0 0 15px rgba(248,113,113,0); } 100% { transform: scale(1); } }
        
        .score-card { background: var(--surface2); padding: 20px; border-radius: 12px; margin-top: 20px; text-align: left; display: none; }
        .score-row { display: flex; align-items: center; margin-bottom: 8px; }
        .bar-bg { flex: 1; height: 8px; background: var(--bg); border-radius: 4px; margin: 0 10px; }
        .bar-fill { height: 100%; border-radius: 4px; background: var(--accent3); }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <span class="logo-badge">OPIc</span>
        <span style="font-size: 14px; margin-left: 10px;"><strong>Korean IM</strong></span>
    </div>
    <nav id="main-nav">
        <button class="nav-btn active" onclick="goSection('input')">Nhập liệu</button>
        <button class="nav-btn" onclick="goSection('vocab')">Từ vựng</button>
        <button class="nav-btn" onclick="goSection('grammar')">Ngữ pháp</button>
        <button class="nav-btn" onclick="goSection('test')">Thi thử</button>
    </nav>
</header>

<main>
    <!-- PHẦN NHẬP LIỆU -->
    <div id="sec-input" class="section visible">
        <h2 style="margin-bottom: 10px;">Bắt đầu luyện tập</h2>
        <p style="color: var(--text2); font-size: 14px; margin-bottom: 20px;">Nhập nội dung bạn muốn học để AI phân tích cấu trúc IM.</p>
        
        <div class="input-card">
            <label style="font-size: 13px; color: var(--accent);">API KEY (Claude)</label>
            <input type="password" id="api-key" class="input-textarea" style="margin-bottom: 15px;" placeholder="Nhập Anthropic API Key để chạy...">
            
            <label style="font-size: 13px; color: var(--accent);">CÂU HỎI TIẾNG HÀN</label>
            <textarea id="inp-question" class="input-textarea" rows="2" placeholder="Ví dụ: 주말에 보통 뭐 해요?"></textarea>
            
            <label style="font-size: 13px; color: var(--accent); margin-top: 15px; display: block;">CÂU TRẢ LỜI CỦA BẠN</label>
            <textarea id="inp-answer" class="input-textarea" rows="5" placeholder="Nhập đoạn văn tiếng Hàn của bạn..."></textarea>
        </div>

        <div class="loading-bar" id="loader"><div class="loading-fill"></div></div>
        <button class="btn-primary" id="btn-analyze" onclick="processAll()">⚡ Phân tích bằng AI</button>
    </div>

    <!-- PHẦN TỪ VỰNG -->
    <div id="sec-vocab" class="section">
        <h2 style="margin-bottom: 20px;">🃏 Flashcards</h2>
        <div class="cards-grid" id="vocab-container"></div>
    </div>

    <!-- PHẦN NGỮ PHÁP -->
    <div id="sec-grammar" class="section">
        <h2 style="margin-bottom: 20px;">📐 Cấu trúc câu</h2>
        <div id="grammar-container"></div>
    </div>

    <!-- PHẦN THI THỬ -->
    <div id="sec-test" class="section">
        <div class="test-box">
            <div id="test-q" style="font-family: var(--korean); font-size: 20px; margin-bottom: 25px;">Chưa có câu hỏi</div>
            <button class="record-btn" id="record-btn" onclick="handleRecord()">🎤</button>
            <p id="rec-status" style="margin-top: 15px; font-size: 13px; color: var(--text2);">Nhấn để bắt đầu nói</p>
            
            <div class="score-card" id="score-card"></div>
        </div>
    </div>
</main>

<script>
    let state = {
        apiKey: '',
        vocab: [],
        grammar: [],
        questions: [],
        isRecording: false,
        recognition: null,
        transcript: ''
    };

    // Chuyển tab
    function goSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('visible'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('sec-' + id).classList.add('visible');
        event.target.classList.add('active');
    }

    // Gọi API Claude
    async function askClaude(system, prompt) {
        const key = document.getElementById('api-key').value;
        if(!key) { alert("Vui lòng nhập API Key!"); return null; }

        try {
            const response = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-api-key': key,
                    'anthropic-version': '2023-06-01',
                    'anthropic-dangerous-direct-browser-access': 'true'
                },
                body: JSON.stringify({
                    model: "claude-3-haiku-20240307",
                    max_tokens: 1500,
                    system: system,
                    messages: [{ role: "user", content: prompt }]
                })
            });
            const data = await response.json();
            return data.content[0].text;
        } catch (e) {
            console.error(e);
            return null;
        }
    }

    // Xử lý tổng thể
    async function processAll() {
        const btn = document.getElementById('btn-analyze');
        const loader = document.getElementById('loader');
        const ans = document.getElementById('inp-answer').value;
        const que = document.getElementById('inp-question').value;

        if(!ans) return alert("Hãy nhập câu trả lời!");

        btn.disabled = true;
        loader.classList.add('show');

        // 1. Phân tích từ vựng và ngữ pháp (Gộp vào 1 lần gọi để tiết kiệm và nhanh)
        const sysPrompt = "Bạn là giáo viên OPIc. Phân tích văn bản tiếng Hàn và trả về JSON duy nhất: {vocab: [{word, mean, ex}], grammar: [{sentence, structure, note}], mock_questions: [text]}";
        const result = await askClaude(sysPrompt, `Phân tích bài trả lời sau cho mục tiêu IM: ${ans}`);

        if(result) {
            try {
                const cleanJson = result.match(/\{[\s\S]*\}/)[0];
                const parsed = JSON.parse(cleanJson);
                state.vocab = parsed.vocab;
                state.grammar = parsed.grammar;
                state.questions = parsed.mock_questions;
                
                renderVocab();
                renderGrammar();
                document.getElementById('test-q').innerText = state.questions[0] || "준비된 질문이 없습니다.";
                
                alert("Đã phân tích xong!");
                goSection('vocab');
            } catch(e) {
                alert("Lỗi xử lý dữ liệu AI.");
            }
        }

        btn.disabled = false;
        loader.classList.remove('show');
    }

    function renderVocab() {
        const container = document.getElementById('vocab-container');
        container.innerHTML = state.vocab.map(v => `
            <div class="flash-card">
                <div style="font-weight:700; color:var(--accent);">${v.word}</div>
                <div style="font-size:13px; margin:5px 0;">${v.mean}</div>
                <div style="font-size:11px; color:var(--text3); font-style:italic;">${v.ex}</div>
            </div>
        `).join('');
    }

    function renderGrammar() {
        const container = document.getElementById('grammar-container');
        container.innerHTML = state.grammar.map(g => `
            <div class="grammar-block">
                <div style="font-family:var(--korean); margin-bottom:8px;">${g.sentence}</div>
                <div class="tag">${g.structure}</div>
                <div style="font-size:13px; color:var(--text2); margin-top:5px;">${g.note}</div>
            </div>
        `).join('');
    }

    // Ghi âm và chấm điểm
    function handleRecord() {
        if (!state.isRecording) {
            startRec();
        } else {
            stopRec();
        }
    }

    function startRec() {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!Speech) return alert("Trình duyệt không hỗ trợ nhận diện giọng nói.");
        
        state.recognition = new Speech();
        state.recognition.lang = 'ko-KR';
        state.recognition.onstart = () => {
            state.isRecording = true;
            document.getElementById('record-btn').classList.add('recording');
            document.getElementById('rec-status').innerText = "Đang nghe... Hãy nói tiếng Hàn";
        };
        state.recognition.onresult = (e) => {
            state.transcript = e.results[0][0].transcript;
        };
        state.recognition.onend = () => {
            state.isRecording = false;
            document.getElementById('record-btn').classList.remove('recording');
            if(state.transcript) gradeAnswer();
        };
        state.recognition.start();
    }

    function stopRec() {
        state.recognition.stop();
    }

    async function gradeAnswer() {
        document.getElementById('rec-status').innerText = "Đang chấm điểm...";
        const prompt = `Câu hỏi: ${document.getElementById('test-q').innerText}. Câu trả lời: ${state.transcript}. Chấm điểm IM (0-100) cho các tiêu chí: Phát âm, Ngữ pháp, Lưu loát. Trả về JSON: {scores: {pronun, gram, fluen}, feedback: string}`;
        
        const result = await askClaude("Bạn là giám khảo OPIc.", prompt);
        if(result) {
            const data = JSON.parse(result.match(/\{[\s\S]*\}/)[0]);
            showScore(data);
        }
    }

    function showScore(data) {
        const card = document.getElementById('score-card');
        card.style.display = 'block';
        card.innerHTML = `
            <h4 style="margin-bottom:15px;">Kết quả thi thử</h4>
            <div class="score-row">Phát âm: <div class="bar-bg"><div class="bar-fill" style="width:${data.scores.pronun}%"></div></div> ${data.scores.pronun}</div>
            <div class="score-row">Ngữ pháp: <div class="bar-bg"><div class="bar-fill" style="width:${data.scores.gram}%"></div></div> ${data.scores.gram}</div>
            <div class="score-row">Lưu loát: <div class="bar-bg"><div class="bar-fill" style="width:${data.scores.fluen}%"></div></div> ${data.scores.fluen}</div>
            <p style="font-size:13px; margin-top:10px; color:var(--accent2); border-top:1px solid var(--border); pt:10px;">${data.feedback}</p>
        `;
        document.getElementById('rec-status').innerText = "Đã xong!";
    }
</script>

</body>
</html>
