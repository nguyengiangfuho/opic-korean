<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OPIC Gemini — Luyện thi miễn phí</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --bg: #0d0f14; --surface: #161923; --surface2: #1e2330;
            --border: #2a3040; --accent: #38bdf8; --accent2: #818cf8;
            --text: #e8ecf4; --text2: #8a95ad; --danger: #f87171;
            --korean: 'Noto Sans KR', sans-serif; --viet: 'Be Vietnam Pro', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: var(--viet); min-height: 100vh; }
        header {
            background: rgba(13, 15, 20, 0.9); border-bottom: 1px solid var(--border);
            padding: 15px 20px; display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px);
        }
        .logo-badge { background: #38bdf8; border-radius: 6px; padding: 4px 8px; font-weight: 700; color: #000; font-size: 14px; }
        nav { display: flex; gap: 5px; }
        .nav-btn { background: none; border: none; color: var(--text2); padding: 8px 12px; cursor: pointer; border-radius: 6px; font-size: 13px; transition: 0.3s; }
        .nav-btn.active { color: var(--accent); background: rgba(56, 189, 248, 0.1); }
        main { max-width: 800px; margin: 0 auto; padding: 25px 15px; }
        .section { display: none; }
        .section.visible { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .input-card { background: var(--surface); border: 1px solid var(--border); padding: 20px; border-radius: 12px; margin-bottom: 15px; }
        .input-textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 8px; font-family: var(--korean); margin-top: 8px; margin-bottom: 12px; }
        .btn-primary { background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 700; width: 100%; transition: 0.3s; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .flash-card { background: var(--surface); border: 1px solid var(--border); padding: 15px; border-radius: 10px; text-align: center; }
        .grammar-block { background: var(--surface); border-left: 4px solid var(--accent); padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .record-btn { width: 60px; height: 60px; border-radius: 50%; border: none; background: var(--danger); color: white; font-size: 24px; cursor: pointer; }
        .record-btn.recording { animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .score-card { background: var(--surface2); padding: 20px; border-radius: 12px; margin-top: 20px; display: none; }
    </style>
</head>
<body>

<header>
    <div class="logo"><span class="logo-badge">GEMINI</span> <span style="font-size: 14px; font-weight: bold; margin-left: 5px;">OPIc Pro</span></div>
    <nav>
        <button class="nav-btn active" onclick="goSection('input')">Nhập liệu</button>
        <button class="nav-btn" onclick="goSection('vocab')">Học tập</button>
        <button class="nav-btn" onclick="goSection('test')">Thi thử</button>
    </nav>
</header>

<main>
    <div id="sec-input" class="section visible">
        <div class="input-card">
            <label style="font-size: 12px; color: var(--accent);">GOOGLE GEMINI API KEY</label>
            <input type="password" id="api-key" class="input-textarea" placeholder="Dán Gemini API Key vào đây...">
            
            <label style="font-size: 12px; color: var(--accent);">CÂU HỎI (TIẾNG HÀN)</label>
            <textarea id="inp-question" class="input-textarea" rows="2" placeholder="주말에 보통 뭐 하세요?"></textarea>
            
            <label style="font-size: 12px; color: var(--accent);">CÂU TRẢ LỜI CỦA BẠN</label>
            <textarea id="inp-answer" class="input-textarea" rows="5" placeholder="Nhập đoạn văn tiếng Hàn..."></textarea>
            
            <button class="btn-primary" id="btn-process" onclick="processWithGemini()">⚡ PHÂN TÍCH MIỄN PHÍ</button>
        </div>
    </div>

    <div id="sec-vocab" class="section">
        <h3 style="margin-bottom:15px;">🃏 Từ vựng & Ngữ pháp</h3>
        <div class="cards-grid" id="vocab-container" style="margin-bottom: 25px;"></div>
        <div id="grammar-container"></div>
    </div>

    <div id="sec-test" class="section">
        <div class="input-card" style="text-align:center;">
            <div id="test-q" style="font-size: 18px; margin-bottom: 20px; font-family: var(--korean);">Đang chờ dữ liệu...</div>
            <button class="record-btn" id="record-btn" onclick="toggleRecord()">🎤</button>
            <p id="rec-status" style="margin-top:15px; font-size:13px; color:var(--text2);">Nhấn để trả lời</p>
            <div class="score-card" id="score-card"></div>
        </div>
    </div>
</main>

<script>
    let state = { vocab: [], grammar: [], questions: [], transcript: '', isRecording: false };

    function goSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('visible'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('sec-' + id).classList.add('visible');
    }

    async function processWithGemini() {
        const key = document.getElementById('api-key').value;
        const ans = document.getElementById('inp-answer').value;
        const que = document.getElementById('inp-question').value;
        if(!key || !ans) return alert("Vui lòng nhập API Key và Câu trả lời!");

        const btn = document.getElementById('btn-process');
        btn.disabled = true; btn.innerText = "ĐANG PHÂN TÍCH...";

        const prompt = `Bạn là chuyên gia luyện thi OPIc. Hãy phân tích câu trả lời tiếng Hàn này: "${ans}" cho câu hỏi "${que}".
        Trả về kết quả dưới dạng JSON thuần túy (không nằm trong mã code):
        {
            "vocab": [{"word": "từ", "mean": "nghĩa", "ex": "ví dụ"}],
            "grammar": [{"sentence": "câu", "note": "giải thích"}],
            "mocks": ["câu hỏi 1", "câu hỏi 2"]
        }`;

        try {
            const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            
            const data = await resp.json();
            const text = data.candidates[0].content.parts[0].text;
            const parsed = JSON.parse(text.replace(/```json|```/g, ""));
            
            state.vocab = parsed.vocab;
            state.grammar = parsed.grammar;
            state.questions = parsed.mocks;

            renderData();
            goSection('vocab');
        } catch (e) {
            alert("Lỗi: Kiểm tra API Key hoặc kết nối mạng!");
            console.error(e);
        } finally {
            btn.disabled = false; btn.innerText = "⚡ PHÂN TÍCH MIỄN PHÍ";
        }
    }

    function renderData() {
        document.getElementById('vocab-container').innerHTML = state.vocab.map(v => `<div class="flash-card"><b>${v.word}</b><br><small>${v.mean}</small></div>`).join('');
        document.getElementById('grammar-container').innerHTML = state.grammar.map(g => `<div class="grammar-block"><p>${g.sentence}</p><small>${g.note}</small></div>`).join('');
        document.getElementById('test-q').innerText = state.questions[0] || "준비된 질문이 없습니다.";
    }

    function toggleRecord() {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!Speech) return alert("Trình duyệt không hỗ trợ!");

        if(!state.isRecording) {
            const rec = new Speech();
            rec.lang = 'ko-KR';
            rec.onstart = () => { 
                state.isRecording = true; 
                document.getElementById('record-btn').classList.add('recording');
                document.getElementById('rec-status').innerText = "Đang nghe tiếng Hàn...";
            };
            rec.onresult = (e) => { state.transcript = e.results[0][0].transcript; };
            rec.onend = () => { 
                state.isRecording = false; 
                document.getElementById('record-btn').classList.remove('recording');
                if(state.transcript) gradeWithGemini();
            };
            rec.start();
        }
    }

    async function gradeWithGemini() {
        const key = document.getElementById('api-key').value;
        document.getElementById('rec-status').innerText = "Đang chấm điểm...";
        
        const prompt = `Câu hỏi OPIc: ${document.getElementById('test-q').innerText}. Học viên nói: ${state.transcript}. Hãy chấm điểm từ 0-100 và nhận xét ngắn bằng tiếng Việt. Trả về JSON: {"score": 80, "feedback": "..."}`;

        try {
            const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await resp.json();
            const result = JSON.parse(data.candidates[0].content.parts[0].text.replace(/```json|```/g, ""));
            
            const card = document.getElementById('score-card');
            card.style.display = 'block';
            card.innerHTML = `<h4>Điểm: ${result.score}/100</h4><p>${result.feedback}</p>`;
            document.getElementById('rec-status').innerText = "Đã chấm xong!";
        } catch(e) { console.error(e); }
    }
</script>
</body>
</html>
